# Staging / single-VPS deployment. Copy .env.docker.example → .env.docker and fill every secret.
#   docker compose --env-file .env.docker up -d --build
#   docker compose --env-file .env.docker run --rm migrate
#   docker compose --env-file .env.docker run --rm seed        # demo data (staging only)
# PostgreSQL and the API are NOT published to the host; only Nginx listens on 80/443.
name: hms

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  APP_ORIGINS: ${APP_ORIGINS}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  LOG_LEVEL: info
  DATABASE_URL: postgresql://hms_app:${DB_APP_PASSWORD}@postgres:5432/${DB_NAME}
  DATABASE_SYSTEM_URL: postgresql://hms_system:${DB_SYSTEM_PASSWORD}@postgres:5432/${DB_NAME}
  MIGRATION_DATABASE_URL: postgresql://hms_owner:${DB_OWNER_PASSWORD}@postgres:5432/${DB_NAME}
  JWT_SECRET: ${JWT_SECRET}
  PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
  CSRF_SECRET: ${CSRF_SECRET}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /app/apps/api/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  AI_PROVIDER: disabled
  DEMO_PASSWORD_PLATFORM: ${DEMO_PASSWORD_PLATFORM:-}
  DEMO_PASSWORD_ADMIN: ${DEMO_PASSWORD_ADMIN:-}
  DEMO_PASSWORD_TEACHER: ${DEMO_PASSWORD_TEACHER:-}
  DEMO_PASSWORD_STUDENT: ${DEMO_PASSWORD_STUDENT:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./scripts/sql/roles.sql:/docker-entrypoint-initdb.d/roles.sql.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ["tools"]
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://hms_owner:${DB_OWNER_PASSWORD}@postgres:5432/${DB_NAME}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on: { postgres: { condition: service_healthy } }

  seed:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ["tools"]
    environment:
      <<: *api-env
      ALLOW_DEMO_SEED: "true"
    command: ["node", "dist/scripts/seed-demo.js"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment: *api-env
    volumes:
      - uploads:/app/apps/api/storage
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/hms-locations.conf:/etc/nginx/hms-locations.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on: [web, api]

volumes:
  pgdata:
  uploads:
