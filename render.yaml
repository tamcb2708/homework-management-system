# Render Blueprint – one free web service (API + web in one container, see Dockerfile.render).
# Database: a free Neon PostgreSQL project. Paste its OWNER connection string into ADMIN_DATABASE_URL
# when Render asks (Blueprint → "sync: false" values). Secrets below are generated by Render; none live in git.
# Guide: docs/deployment.md §9.
services:
  - type: web
    name: homework-management
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      # ── Provided by you ──
      - key: ADMIN_DATABASE_URL        # Neon → Connect → connection string (owner role, pooling OFF)
        sync: false
      - key: DEMO_PASSWORD_PLATFORM    # passwords for the demo accounts (≥ 12 characters, your choice)
        sync: false
      - key: DEMO_PASSWORD_ADMIN
        sync: false
      - key: DEMO_PASSWORD_TEACHER
        sync: false
      - key: DEMO_PASSWORD_STUDENT
        sync: false
      # ── Generated by Render (kept stable across deploys) ──
      - key: DB_OWNER_PASSWORD
        generateValue: true
      - key: DB_APP_PASSWORD
        generateValue: true
      - key: DB_SYSTEM_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # ── Fixed settings ──
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: disabled              # D11: AI grading stays off
      - key: STORAGE_DRIVER
        value: local                 # free plan disk is temporary – see docs/deployment.md §9
      - key: SEED_DEMO
        value: "true"
      - key: DB_NAME
        value: hms
