# Edge proxy: HTTPS termination, security headers, /api → API, / → web. Only this container is published.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 50m;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  upstream api { server api:4000; keepalive 16; }
  upstream web { server web:3000; keepalive 16; }

  server {
    listen 80;
    server_name _;
    # When TLS is terminated here, redirect HTTP → HTTPS (uncomment after certificates exist):
    # return 301 https://$host$request_uri;
    include /etc/nginx/hms-locations.conf;
  }

  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name staging.example.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   include /etc/nginx/hms-locations.conf;
  # }
}
